server {
    listen 80 default_server;
    server_name _;

    # すべてのHTTPアクセスを強制的にHTTPSへリダイレクト
    location / {
        return 301 https://$host:4443$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    server_name _;
    # タスク#138・#139で準備した自己署名証明書の設定
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # SSLプロトコルと暗号化の推奨設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Keycloakへのルーティング（正常稼働中・そのまま維持）
    location /keycloak {
        proxy_pass http://keycloak:8080/keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 2. Redmineへのルーティング（★多重パス防止の決定版）
    location /redmine/ { # 末尾にスラッシュを付けます
        proxy_pass http://redmine:3000/; # ★末尾にスラッシュを必ず付けます！
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # 末尾スラッシュなしでアクセスされた時も救済する設定
    location /redmine {
        return 301 https://$host/redmine/;
    }

}
