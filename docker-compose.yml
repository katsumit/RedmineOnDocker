secrets:
  db_password:
    file: ./db_password.txt
  secret_key_base:
    file: ./secret_key_base.txt
  kc_admin_password:
    file: ./kc_admin_password.txt

services:
  # === 【新設】Nginxリバースプロキシを合流 ===
  nginx:
    image: nginx:alpine
    container_name: global-proxy
    ports:
      - "80:80" # ホストの80番ポート（ポート番号なし）で受け口を作る
      - "4443:443" 
    volumes:
      # 主設定ファイルではなく、追加設定(app.conf)としてマウントします
      - ./nginx.conf:/etc/nginx/conf.d/app.conf:ro
      # ★これが最も重要：デフォルト設定ファイルを空ファイルで完全に潰します
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      # SSL証明書のマウント
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      - keycloak
      - redmine
    restart: always

  redmine:
    image: redmine:7.0
    mem_limit: 2g
    networks:
      - frontend
    volumes:
      - ./data/volume:/usr/src/redmine/files
      - ./data/plugins:/usr/src/redmine/plugins
      - ./certs/server.crt:/tmp/server.crt
    restart: always
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: root
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      TZ: Asia/Tokyo
      # ★この2行をセットで指定します（他のURL関連変数は削除）
      RAILS_RELATIVE_URL_ROOT: /redmine
      SCRIPT_NAME: /redmine
      OAUTH_KEYCLOAK_SITE: https://global-proxy:4443/keycloak
      OAUTH_KEYCLOAK_SSL_VERIFY: "false"
      RUBYOPT: "-W0" 
      SSL_CERT_FILE: /tmp/server.crt
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
      - secret_key_base
    extra_hosts: 
      - "localhost:host-gateway"
  db:
    image: mysql:8.0
    mem_limit: 1g
    command: mysqld --default-authentication-plugin=mysql_native_password --skip-character-set-client-handshake --init-connect='SET NAMES utf8mb4'
    networks:
      - frontend
    ports:
      - "3306:3306"
    volumes:
      - ./data/database:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: redmine
    secrets:
      - db_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: mysql:8.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export MYSQL_PWD="$$(cat /run/secrets/db_password)"; exec mysql -h db -u root -e "CREATE DATABASE IF NOT EXISTS keycloak_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"'
    networks:
      - frontend
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-server
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/kc_admin_password)"; export KC_DB_PASSWORD="$$(cat /run/secrets/db_password)"; exec /opt/keycloak/bin/kc.sh start-dev'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://db:3306/keycloak_db
      KC_DB_USERNAME: root
    networks:
      - frontend
    depends_on:
      db-init:
        condition: service_completed_successfully
    secrets:
      - db_password
      - kc_admin_password
    restart: always

networks:
  frontend:
