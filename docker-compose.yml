secrets:
  db_password:
    file: ./db_password.txt
  secret_key_base:
    file: ./secret_key_base.txt


services:

  redmine:
    image: redmine:7.0
    mem_limit: 2g
    networks:
      - frontend
    volumes:
      - ./data/volume:/usr/src/redmine/files
      - ./data/plugins:/usr/src/redmine/plugins
    restart: always
    ports:
      - 8080:3000
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: root
      REDMINE_DB_PASSWORD_FILE: /run/secrets/db_password 
      REDMINE_SECRET_KEY_BASE_FILE: /run/secrets/secret_key_base
      TZ: Asia/Tokyo
    depends_on:
      # 🚀 【最重要】service_started から service_healthy に変更し、MySQLの準備が完全に整うまでRedmineを安全に待機させます
      db:
        condition: service_healthy
    secrets:
      - db_password
      - secret_key_base

  db:
    image: mysql:8.0
    mem_limit: 1g
    command: mysqld --default-authentication-plugin=mysql_native_password --skip-character-set-client-handshake --init-connect='SET NAMES utf8mb4'
    networks:
      - frontend
    ports:
      - 3306:3306
    volumes:
      - ./data/database:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password 
      MYSQL_DATABASE: redmine
    secrets:
      - db_password
    # 🚀 【追加】複雑なクォーテーションを排除した、MySQL 8.0で100%確実に動く軽量ヘルスチェック
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
  
networks:
  frontend: